build:
  maxIssues: 0

complexity:
  LongMethod:
    threshold: 60
    ignoreAnnotated: ['Test']
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 12
  TooManyFunctions:
    thresholdInFiles: 25
    thresholdInClasses: 15
  CyclomaticComplexMethod:
    threshold: 15
    ignoreAnnotated: ['Test']
  NestedBlockDepth:
    threshold: 4

style:
  ForbiddenComment:
    active: false
  MagicNumber:
    active: false
  MaxLineLength:
    maxLineLength: 140
  ReturnCount:
    max: 5
  WildcardImport:
    active: true
  UnusedPrivateMember:
    active: true
  UnnecessaryAbstractClass:
    active: true
  DataClassShouldBeImmutable:
    active: true
  VarCouldBeVal:
    active: true

potential-bugs:
  CastToNullableType:
    active: true
  UnnecessaryNotNullOperator:
    active: true
  UselessPostfixExpression:
    active: true

exceptions:
  TooGenericExceptionCaught:
    active: true
  TooGenericExceptionThrown:
    active: true
  SwallowedException:
    active: true

naming:
  MatchingDeclarationName:
    active: false
  FunctionNaming:
    functionPattern: '[a-z][a-zA-Z0-9]*'
  ClassNaming:
    classPattern: '[A-Z][a-zA-Z0-9]*'
  VariableNaming:
    variablePattern: '[a-z][a-zA-Z0-9]*'
    privateVariablePattern: '[a-z_][a-zA-Z0-9]*'
